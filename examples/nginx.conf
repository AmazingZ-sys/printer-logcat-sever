# Add inside Nginx's http context. Replace domain and TLS certificate paths.
# The service can be reached at 127.0.0.1:3000 when Nginx runs on the host.
# For containerized Nginx on the same Compose network, use printer-logs:3000.
upstream printer_logs {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name logs.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name logs.example.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 256k;

    location / {
        proxy_pass http://printer_logs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";

        # Send SSE immediately and allow its long-lived connection.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
